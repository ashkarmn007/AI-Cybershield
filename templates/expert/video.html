{#<!DOCTYPE html>#}
<html lang="en">
{% extends "expert/index.html" %}
{% block body %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Videos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e0f7fa; /* Light cyan */
        }
        .video-card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        h1 {
            color: #007b8f;
            margin-bottom: 30px;
        }
        video {
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container video-card">
        <h1 class="text-center"><u>View Videos</u></h1>

        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center">
                <thead class="table-info">
                    <tr>
                        <th>SI No.</th>
                        <th>Video</th>
                        <th>Title</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in data %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>
                            <video controls width="200" height="200">
                                <source src="/media/{{ i.video }}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </td>
                        <td>{{ i.title }}</td>
                        <td>{{ i.date }}</td>
                        <td>
                            <a href="/myapp/delete_vdo/{{ i.id }}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this video?')">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5">No videos available.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="text-end mt-3">
            <a href="/myapp/addvdo/" class="btn btn-info text-white">Add New Video</a>
        </div>
    </div>
</body>
{% endblock %}
</html>
