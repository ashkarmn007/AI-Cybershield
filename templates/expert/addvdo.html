
{% extends "expert/index.html" %}
{% block body %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Video</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e0f7fa; /* Light cyan */
        }
        .form-card {
            max-width: 500px;
            margin: 80px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007b8f;
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h1><u>Add Video</u></h1>

            <form action="/myapp/addvdo_post/" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="video" class="form-label">Video</label>
                    <input type="file" name="video" id="video" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" name="title" id="title" class="form-control" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-info text-white">Add Video</button>
                </div>
            </form>
        </div>
    </div>

</body>
{% endblock %}
</html>
