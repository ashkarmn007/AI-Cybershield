{#<!DOCTYPE html>#}
{% extends "expert/index.html" %}
{% block body %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Tip</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e0f7fa; /* Light cyan background */
        }
        .form-card {
            max-width: 500px;
            margin-top: 80px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        h3 {
            color: #007b8f;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-card">
            <h3 class="text-center mb-4" id="ab"><u>Add Tip</u></h3>

            <form action="/myapp/add_new_post/" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <textarea id="title" name="title" class="form-control" rows="1" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="details" class="form-label">Details</label>
                    <textarea id="details" name="details" class="form-control" rows="5" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="video" class="form-label">Video</label>
                    <input type="file" name="video">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-info text-white">Add Tip</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
{% endblock %}
