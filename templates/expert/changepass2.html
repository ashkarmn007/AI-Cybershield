{% extends 'expert/index.html' %}
{% block body %}
<head>
    <title>Change Password</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e0f7fa; /* light cyan */
        }
        .form-container {
            max-width: 400px;
            margin-top: 80px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-container">
            <h4 class="text-center text-primary mb-4"><u>Change Password</u></h4>

            <form action="/myapp/changepass2_post/" method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="old" class="form-label">Old Password</label>
                    <input type="password" class="form-control" name="old" id="old" required>
                </div>

                <div class="mb-3">
                    <label for="new" class="form-label">New Password</label>
                    <input type="password" class="form-control" name="new" id="new" required>
                </div>

                <div class="mb-3">
                    <label for="confirm" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" name="confirm" id="confirm" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-info text-white">Change Password</button>
                </div>
            </form>
        </div>
    </div>
</body>
{% endblock %}
