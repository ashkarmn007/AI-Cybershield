{% extends "expert/index.html" %}
{% block body %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Doubts</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e0f7fa; /* Light cyan */
        }
        .doubt-card {
            margin-top: 60px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007b8f;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container doubt-card">
    <h1 class="text-center"><u>View Doubts</u></h1>

    <div class="table-responsive">
        <table class="table table-bordered align-middle text-center">
            <thead class="table-info">
                <tr>
                    <th>SI No.</th>
                    <th>User</th>
                    <th>Doubt</th>
                    <th>Date</th>
                    <th>Reply</th>
                </tr>
            </thead>
            <tbody>
                {% for i in data %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ i.USER }}</td>
                    <td>{{ i.doubt }}</td>
                    <td>{{ i.date }}</td>
                    <td>
                        <a href="/myapp/send_reply/{{ i.id }}" class="btn btn-danger btn-sm">Reply</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="text-center text-muted">No doubts available.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>

{% endblock %}
