{% extends "expert/index.html" %}
{% block body %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e0f7fa; /* light cyan */
        }
        .form-card {
            max-width: 500px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-card">
            <h2 class="text-center text-primary mb-4"><u>Edit Profile</u></h2>

            <form action="/myapp/edit_profile_post/" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" value="{{ data.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ data.email }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="number" name="phone" class="form-control" value="{{ data.phone }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Place</label>
                    <input type="text" name="place" class="form-control" value="{{ data.place }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Qualification</label>
                    <input type="text" name="qualification" class="form-control" value="{{ data.qualification }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Post</label>
                    <input type="text" name="post" class="form-control" value="{{ data.post }}" required>
                </div>
                <div class="mb-3">
    <label class="form-label">Main Certificate</label><br>
    <a href="{{ data.certificate.url }}" target="_blank">View Current</a>
    <input type="file" name="certificate" class="form-control mt-2">
{#    <input type="checkbox" name="remove_certificate"> Remove#}
</div>

<div class="mb-3">
    <label class="form-label">Certificate 1 (Optional)</label><br>
    {% if data.certificate1 %}
        <a href="{{ data.certificate1.url }}" target="_blank">View Current</a>
    {% endif %}
    <input type="file" name="certificate1" class="form-control mt-2">
{#    <input type="checkbox" name="remove_certificate1"> Remove#}
</div>

<div class="mb-3">
    <label class="form-label">Certificate 2 (Optional)</label><br>
    {% if data.certificate2 %}
        <a href="{{ data.certificate2.url }}" target="_blank">View Current</a>
    {% endif %}
    <input type="file" name="certificate2" class="form-control mt-2">
{#    <input type="checkbox" name="remove_certificate2"> Remove#}
</div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-info text-white" onclick="return confirm('Profile Updated!')">Update</button>
                </div>

            </form>
        </div>
    </div>

</body>
{% endblock %}
</html>
