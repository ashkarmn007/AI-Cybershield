{% extends "admin/admin_index1.html" %}
{% block body %}
<head>
    <title>Change Password</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 30px;
        }

        .form-container {
            background-color: #1e1e1e;
            width: 360px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            padding: 30px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #bbbbbb;
            font-weight: 500;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            background-color: #2c2c2c;
            color: #ffffff;
        }

        input[type="password"]::placeholder {
            color: #888888;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2563eb;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
    </style>
</head>
<body>
    <div class="center" id="ab">
        <div class="form-container">
            <h2><u>Change Password</u></h2>
            <form action="/myapp/change_password_post/" method="post">
                {% csrf_token %}
                <label for="old">Old Password</label>
                <input type="password" name="old" placeholder="Enter old password" required>

                <label for="new">New Password</label>
                <input type="password" name="new" placeholder="Enter new password" required>

                <label for="confirm">Confirm Password</label>
                <input type="password" name="confirm" placeholder="Confirm new password" required>

                <button type="submit">Change</button>
            </form>
        </div>
    </div>
</body>
{% endblock %}
