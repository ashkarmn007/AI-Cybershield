{#<!DOCTYPE html>#}
<html lang="en">
{% extends "admin/admin_index1.html" %}
{% block body %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        header h1 {
            color: #ffffff;
            margin-top: 40px;
            font-size: 28px;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        th {
            background-color: #2c2c2c;
            color: #ffffff;
            border-bottom: 1px solid #444;
        }

        td {
            border-bottom: 1px solid #333;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        td:nth-child(3) {
            color: #ffd700; /* golden rating */
            font-weight: bold;
        }

        td:nth-child(4) {
            color: #a3d3ff; /* light blue for feedback */
        }

        td:nth-child(5) {
            color: #bbbbbb;
        }
    </style>
</head>
<body>
    <center>
        <header><h1 id="ab"><u>Feedback</u></h1></header>
        <table>
            <tr>
                <th>SI</th>
                <th>User</th>
                <th>Rating</th>
                <th>Feedback</th>
                <th>Date</th>
            </tr>
            {% for i in data %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ i.USER.name }}</td>
                <td>{{ i.rating }}</td>
                <td>{{ i.review }}</td>
                <td>{{ i.date }}</td>
            </tr>
            {% endfor %}
            <!-- Additional rows can be added here -->
        </table>
    </center>
</body>
{% endblock %}
</html>
