<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .box {
            width: 300px;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 25px 20px;
            margin-top: 100px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #bbbbbb;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            background-color: #2c2c2c;
            color: #ffffff;
        }

        input[type="text"]::placeholder {
            color: #888;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <center>
        <div class="box">
            <form action="/myapp/forgot_pass_post/" method="post">
                {% csrf_token %}
                <label for="email">Email:</label>
                <input type="text" name="email" placeholder="Enter your email" required>
                <button type="submit">Send</button>
            </form>
        </div>
    </center>
</body>
</html>
